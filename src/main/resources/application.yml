server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000 # 30天，单位为秒
spring:
  profiles:
    active: local
  servlet:
    multipart:
      # 最大文件上传体积 2MB
      max-file-size: 2MB
  mvc:
    async:
      # 异步请求超时时间，-1 表示不超时（SSE 长连接需要）
      request-timeout: -1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_nocode_backend
    username: root
    password: root
  # Redis 配置
  data:
    redis:
      host: 192.168.88.130
      port: 6379
      password: 123456
      ttl: 3600
      database: 1
  session:
    timeout: 2592000 # 30天，单位为秒
    store-type: redis
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.hefng.mynocodebackend.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    reasoning-streaming-chat-model:
      base-url: https://yunwu.ai/v1
      api-key: ""
      model-name: gpt-5.4-mini
      max-tokens: 131072
      return-thinking: true
      temperature: 0.1
      timeout: 300000 # 300
    # 简单任务 AI 模型配置（用于简单的任务）
    simple-chat-model:
      base-url: https://yunwu.ai/v1
      api-key: ""
      model-name: gpt-5.4-nano
      log-requests: true
      log-responses: true
      max-tokens: 8192
  memory:
    max-messages: 20
    redis-key-prefix: "lc4j:chat_memory:"
    ttl-seconds: 604800 # 7天
cos:
  client:
    host: ""
    secretId: ""
    secretKey: ""
    region: "ap-shanghai"
    bucket: ""
# Selenium WebDriver 池配置
webdriver:
  pool:
    max-size: 3          # 最大 driver 数量，默认 3
    borrow-timeout-seconds: 30  # 借用超时秒数，默认 30
  window:
    width: 1920
    height: 1080
pexels:
  api-key: ""
dashscope:
  api-key: ""
  model-name: "wanx2.0-t2i-turbo"
github:
  oauth:
    client-id: ""
    client-secret: ""
    redirect-uri: "http://localhost:8123/api/user/oauth/github/callback"
    frontend-base-url: "http://localhost:5173"
app:
  codegen:
    agent:
      enabled: true
      fallback-to-legacy: true