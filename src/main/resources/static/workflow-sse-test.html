<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow SSE Test</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      color: #111;
    }
    .wrap {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 20px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    button {
      height: 36px;
      padding: 0 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .status {
      margin: 8px 0 12px;
      font-size: 14px;
      color: #555;
    }
    pre {
      min-height: 420px;
      margin: 0;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #fff;
      overflow: auto;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>CodeGen Workflow SSE 测试页</h1>
  <div class="row">
    <input id="baseUrl" value="http://localhost:8123/api" />
  </div>
  <div class="row">
    <input id="prompt" value="创建一个建议的个人博客网站，不超过50行代码，使用多文件结构" />
    <button id="startBtn">开始</button>
    <button id="stopBtn">停止</button>
    <button id="clearBtn">清空</button>
  </div>
  <div class="status" id="status">状态：未连接</div>
  <pre id="log"></pre>
</div>

<script>
  let source = null;

  const baseUrlInput = document.getElementById('baseUrl');
  const promptInput = document.getElementById('prompt');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');

  function appendLog(line) {
    logEl.textContent += line + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(text) {
    statusEl.textContent = '状态：' + text;
  }

  function closeSource() {
    if (source) {
      source.close();
      source = null;
    }
  }

  function start() {
    closeSource();

    const baseUrl = (baseUrlInput.value || 'http://localhost:8123/api').trim().replace(/\/+$/, '');
    const prompt = (promptInput.value || '').trim();
    const url = baseUrl + '/workflow/execute-flux?prompt=' + encodeURIComponent(prompt || 'test');

    setStatus('连接中...');
    appendLog('>>> CONNECT ' + url);

    source = new EventSource(url);

    source.onopen = function () {
      setStatus('已连接');
    };

    source.onmessage = function (evt) {
      try {
        const outer = JSON.parse(evt.data);
        const eventType = outer.event || 'unknown';
        let data = outer.d;

        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (_) {
            // keep original string
          }
        }

        appendLog('[' + eventType + '] ' + JSON.stringify(data, null, 2));

        if (eventType === 'done') {
          setStatus('已完成');
          closeSource();
        }
      } catch (e) {
        appendLog('[parse_error] ' + evt.data);
      }
    };

    source.onerror = function () {
      setStatus('连接异常/已关闭');
      closeSource();
    };
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', function () {
    closeSource();
    setStatus('已手动停止');
  });
  clearBtn.addEventListener('click', function () {
    logEl.textContent = '';
  });
</script>
</body>
</html>
